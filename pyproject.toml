[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "label-shift-identified-sets"
version = "0.1.0"
description = "Sharp prior ranges under a known label-shift channel, with finite-sample target bands and independent rational checks."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy>=2.1,<3", "scipy>=1.14,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "matplotlib>=3.9,<4"]

[project.scripts]
shift-bounds = "shift_sets.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error"]
